<!doctype html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta charset="utf-8">
<title>打水漂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* 黄昏的湖面，远处是水墨的山。安安静静的一个游戏，外观固定，不跟系统深色走 */
:root{
  color-scheme:light;
  --ink:#2b2630;
  --paper:#fbf4ea;
  --soft:rgba(43,38,48,.65);
  --seal:#b8322a;
  --font-brush:"Ma Shan Zheng","KaiTi",serif;
  --font-body:"Noto Serif SC","Songti SC",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{overflow:hidden;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;touch-action:none;-webkit-user-select:none;user-select:none;background:#2a3348}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--seal);outline-offset:3px}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:0;top:0;width:420px;height:740px;transform-origin:0 0;pointer-events:none}
#hud > *{pointer-events:auto}
.top{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.top > *{pointer-events:auto}
.title{font-family:var(--font-brush);font-size:30px;line-height:1;color:#fff8ee;text-shadow:0 2px 6px rgba(60,30,40,.45)}
.sub{font-size:12px;color:rgba(255,248,238,.85);text-shadow:0 1px 3px rgba(0,0,0,.4)}
.grow{flex:1}
.ibtn{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,248,238,.8);box-shadow:0 3px 10px rgba(0,0,0,.18);font-size:14px;display:grid;place-items:center}
.count{position:absolute;left:0;right:0;top:96px;text-align:center;pointer-events:none;color:#fff8ee;text-shadow:0 3px 10px rgba(40,20,40,.45)}
.count b{display:block;font-family:var(--font-brush);font-weight:400;font-size:84px;line-height:1;transition:transform .12s}
.count b.pop{transform:scale(1.18)}
.count span{font-size:15px}
.cond{position:absolute;left:12px;top:64px;display:flex;gap:6px;pointer-events:none}
.cond span{padding:2px 10px;border-radius:999px;background:rgba(255,248,238,.78);font-size:12px;font-weight:600}
.throws{position:absolute;right:12px;top:64px;display:flex;gap:4px;pointer-events:none}
.throws i{width:22px;height:22px;border-radius:50%;background:rgba(255,248,238,.4);font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--ink)}
.throws i.used{background:rgba(255,248,238,.92)}
.result{position:absolute;left:50%;top:250px;transform:translate(-50%,10px);opacity:0;transition:all .4s;text-align:center;pointer-events:none;white-space:nowrap}
.result.show{opacity:1;transform:translate(-50%,0)}
.result b{display:inline-block;padding:4px 20px;border-radius:999px;background:rgba(251,244,234,.92);font-family:var(--font-brush);font-weight:400;font-size:30px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.result span{display:block;margin-top:6px;color:#fff8ee;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:6px 16px;border-radius:999px;background:rgba(43,38,48,.72);color:#fff8ee;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .4s}

#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(30,20,40,.45)}
.card{width:min(360px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:20px;background:var(--paper);box-shadow:0 24px 60px rgba(0,0,0,.4);padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
.card h2{margin:0;font-family:var(--font-brush);font-weight:400;font-size:34px}
.card p{margin:0}
.card .n{font-family:var(--font-brush);font-size:64px;line-height:1;color:var(--seal)}
.card .small{font-size:12px;color:var(--soft)}
.card ul{margin:0;padding-left:1.2em;text-align:left;font-size:14px;display:flex;flex-direction:column;gap:6px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:16px;background:var(--ink);color:#fbf4ea}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px}
.row > *{flex:1}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="top">
      <div><div class="title">打水漂</div><div class="sub" id="sub"></div></div>
      <span class="grow"></span>
      <button class="ibtn" id="btnBoard" type="button" aria-label="今日排行榜">🏆</button>
      <button class="ibtn" id="btnHelp" type="button" aria-label="怎么玩">?</button>
      <button class="ibtn" id="btnSound" type="button" aria-label="声音">🔊</button>
    </div>
    <div class="cond" id="cond"></div>
    <div class="throws" id="throws"></div>
    <div class="count" id="count" hidden><b id="skips">0</b><span id="dist"></span></div>
    <div class="result" id="result"><b></b><span></span></div>
    <div class="hint" id="hint">按住石头，看角度，往前一甩</div>
  </div>
</div>
<div id="modal" hidden></div>

<!--BOARD 五个小游戏共用的每日排行榜（tools/board.html，用 tools/embed-board.mjs 塞进各个游戏）-->
<style>
.mb-wrap{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,25,20,.5);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#33302e;-webkit-user-select:none;user-select:none}
.mb-card{width:min(380px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:24px;background:#fffaf3;box-shadow:0 24px 60px rgba(40,20,10,.35);padding:22px 18px 18px;display:flex;flex-direction:column;gap:10px;text-align:center;animation:mb-pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mb-pop{from{transform:translateY(14px) scale(.95);opacity:0}}
.mb-card h2{margin:0;font-family:"ZCOOL KuaiLe","PingFang SC",sans-serif;font-weight:400;font-size:28px;line-height:1.2}
.mb-sub{margin:0;font-size:12px;color:#7a716a}
.mb-tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:#f1e8dc;align-self:center}
.mb-tabs button{border:0;border-radius:999px;padding:6px 14px;background:transparent;font:inherit;font-weight:700;font-size:13px;color:#7a716a;cursor:pointer}
.mb-tabs button.on{background:#fff;color:#33302e;box-shadow:0 2px 6px rgba(60,30,10,.12)}
.mb-mine{margin:0;font-size:14px;font-weight:700;color:#3b9c80;min-height:1.4em}
.mb-list{display:flex;flex-direction:column;gap:6px;min-height:110px;max-height:50vh;overflow:auto;margin:0 -4px;padding:2px 4px;text-align:left}
.mb-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(60,40,30,.12)}
.mb-row.me{background:#e6f7f1;box-shadow:inset 0 0 0 2px #5fc7a8}
.mb-rk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:"Baloo 2","Noto Sans SC",sans-serif;font-weight:800;font-size:14px;color:#7a716a}
.mb-rk.g1{background:#ffd54f;color:#7a5200}.mb-rk.g2{background:#dfe3e8;color:#4a5560}.mb-rk.g3{background:#f1c39a;color:#7a3f12}
.mb-nm{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-sc{flex:none;max-width:52%;text-align:right;font-size:12px;color:#7a716a;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-sc b{display:block;font-family:"Baloo 2","Noto Sans SC",sans-serif;font-weight:800;font-size:15px;color:#33302e}
.mb-note{margin:0;padding:18px 0;text-align:center;font-size:13px;color:#7a716a}
.mb-row2{display:flex;gap:8px}
.mb-row2 > *{flex:1}
.mb-btn{border:0;border-radius:14px;padding:11px 10px;font:inherit;font-weight:900;font-size:15px;cursor:pointer;background:#fff;color:#33302e;box-shadow:inset 0 0 0 1.5px rgba(60,40,30,.14);-webkit-tap-highlight-color:transparent}
.mb-btn.main{background:#5fc7a8;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 8px 18px rgba(40,120,100,.3)}
.mb-btn:active{transform:translateY(2px)}
.mb-input{width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;font-weight:700;color:#33302e;background:#fff;box-shadow:inset 0 0 0 2px rgba(60,40,30,.14);outline:none;-webkit-user-select:text;user-select:text}
.mb-input:focus{box-shadow:inset 0 0 0 2px #5fc7a8}
.mb-err{min-height:1.2em;margin:0;font-size:12px;color:#ff7a6b}
</style>
<script>
window.MiniBoard = (() => {
'use strict';
// Supabase 项目的地址和公开 key（公开 key 本来就是给网页用的，能读榜、能交成绩，改不了别人的）
const URL0 = 'https://ghjrmmqnajguwkfoplgo.supabase.co', KEY = 'sb_publishable_1YWUN4fZ3c_TjQD9p6Lmlg_K-vDB6y_';
const PREVIEW = !!window.claude || /(^|\.)claude(usercontent)?\.(ai|com)$/.test(location.hostname);
const store = {
  get(k, d){ try { const v = localStorage.getItem('mini:' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } },
  set(k, v){ try { localStorage.setItem('mini:' + k, JSON.stringify(v)); } catch (e){} }
};
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
// game：哪个游戏；first：一天只算第一局（否则留当天最好的一局）
let cfg = {game: '', first: false};
const day = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// 每个人一个只存在自己手机上的编号（交成绩、改名用），和一个公开的短标记（榜上认出自己用）；五个游戏共用一个名字
function me(){
  let m = store.get('me', null);
  if (!m){
    const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
    const h = hex(16);
    m = {pid: `${h.slice(0, 8)}-${h.slice(8, 12)}-4${h.slice(13, 16)}-a${h.slice(17, 20)}-${h.slice(20, 32)}`, tag: hex(4), name: ''};
    store.set('me', m);
  }
  return m;
}
let api = async (path, body) => {
  const headers = {apikey: KEY, 'Content-Type': 'application/json'};
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(URL0 + '/rest/v1/' + path, body ? {method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal} : {headers, signal: ctl.signal});
    if (!r.ok) throw new Error('http ' + r.status);
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  } finally {
    clearTimeout(timer);
  }
};
const pendKey = board => `pend:${cfg.game}:${board}`, sentKey = board => `sent:${cfg.game}:${board}`;
const better = (x, y) => x.a > y.a || (x.a === y.a && (x.b || 0) > (y.b || 0));
// 交成绩：a 越大越好，a 一样比 b；shown 是榜上显示的成绩，extra 是下面一行小字
function submit(board, sc){
  const d = day(), p = store.get(pendKey(board), null), sent = store.get(sentKey(board), null);
  if (cfg.first && ((sent && sent.day === d) || (p && p.day === d))) return;
  if (p && p.day === d && !better(sc, p)) return;
  if (sent && sent.day === d && !better(sc, sent)) return;
  store.set(pendKey(board), {day: d, a: sc.a, b: sc.b || 0, shown: String(sc.shown).slice(0, 40), extra: String(sc.extra || '').slice(0, 60)});
  flush(board).catch(() => {});
}
async function flush(board){
  const p = store.get(pendKey(board), null), m = me();
  if (!p || !m.name || PREVIEW) return null;
  const res = await api('rpc/mini_submit', {p_game: cfg.game, p_board: board, p_day: p.day, p_player: m.pid, p_tag: m.tag, p_name: m.name, p_a: p.a, p_b: p.b, p_shown: p.shown, p_extra: p.extra});
  store.set(pendKey(board), null);
  store.set(sentKey(board), {day: p.day, a: p.a, b: p.b});
  return res;
}
const open = card => { close(); const w = el('div', 'mb-wrap'); w.id = 'mbWrap'; w.appendChild(card); w.addEventListener('click', e => { if (e.target === w) close(); }); document.body.appendChild(w); };
const close = () => { const w = document.getElementById('mbWrap'); if (w) w.remove(); };
// 打开今天的排行榜。o: {title, sub, empty, tabs: [{id, label}]}（有好几张榜的时候上面放一排切换）
async function show(board = '', o = {}){
  const card = el('div', 'mb-card');
  const mine = el('p', 'mb-mine'), list = el('div', 'mb-list');
  card.append(el('h2', '', o.title || '今天的排行榜'), el('p', 'mb-sub', o.sub || ''));
  if (o.tabs){
    const tabs = el('div', 'mb-tabs');
    for (const t of o.tabs){
      const b = el('button', t.id === board ? 'on' : '', t.label);
      b.type = 'button';
      b.addEventListener('click', () => { if (t.id !== board) show(t.id, o); });
      tabs.appendChild(b);
    }
    card.appendChild(tabs);
  }
  card.append(mine, list);
  list.appendChild(el('p', 'mb-note', '正在打开排行榜…'));
  const row = el('div', 'mb-row2');
  const nm = el('button', 'mb-btn', me().name ? '改名字' : '起个名字');
  nm.type = 'button';
  nm.addEventListener('click', () => askName(() => show(board, o)));
  const cl = el('button', 'mb-btn main', '关闭');
  cl.type = 'button';
  cl.addEventListener('click', close);
  row.append(nm, cl);
  card.appendChild(row);
  open(card);
  if (PREVIEW){ list.replaceChildren(el('p', 'mb-note', '预览里连不上排行榜，到网页版看')); return; }
  let res = null;
  try { res = await flush(board); } catch (e){}
  let rows;
  try { rows = await api(`mini_scores?select=tag,name,a,b,shown,extra&game=eq.${cfg.game}&board=eq.${encodeURIComponent(board)}&day=eq.${day()}&order=a.desc,b.desc,updated_at.asc&limit=100`); } catch (e){ if (list.isConnected) list.replaceChildren(el('p', 'mb-note', '排行榜没连上，过一会儿再试')); return; }
  if (!list.isConnected) return;
  const m = me();
  list.replaceChildren();
  if (!rows.length) list.appendChild(el('p', 'mb-note', '今天还没有人上榜，来当第一个'));
  let myRank = 0;
  rows.forEach((r, k) => {
    const isMe = r.tag === m.tag;
    if (isMe) myRank = k + 1;
    const d = el('div', 'mb-row' + (isMe ? ' me' : ''));
    const sc = el('span', 'mb-sc');
    sc.append(el('b', '', r.shown), document.createTextNode(r.extra || ''));
    d.append(el('span', 'mb-rk' + (k < 3 ? ' g' + (k + 1) : ''), String(k + 1)), el('span', 'mb-nm', r.name + (isMe ? '（我）' : '')), sc);
    list.appendChild(d);
  });
  const p = store.get(pendKey(board), null);
  if (myRank) mine.textContent = `你排第 ${myRank} 名，一共 ${rows.length}${rows.length >= 100 ? '+' : ''} 人`;
  else if (res && res.rank) mine.textContent = `你排第 ${res.rank} 名，一共 ${res.total} 人`;
  else if (p && p.day === day()) mine.textContent = m.name ? '成绩还没交上去，过一会儿再打开试试' : '起个名字，今天的成绩就能上榜';
  else if ((store.get(sentKey(board), null) || {}).day === day()) mine.textContent = '你在 100 名以外';
  else mine.textContent = o.empty || '玩一局就能上榜';
  if (myRank) setTimeout(() => list.children[myRank - 1]?.scrollIntoView({block: 'nearest'}), 50);
}
function askName(then){
  const card = el('div', 'mb-card');
  const m = me();
  card.append(el('h2', '', m.name ? '改个名字' : '起个名字上榜'), el('p', 'mb-sub', '排行榜上显示这个名字，最多 12 个字，几个小游戏共用'));
  const input = el('input', 'mb-input');
  input.type = 'text';
  input.maxLength = 12;
  input.placeholder = '比如：小游戏大王';
  input.value = m.name || '';
  input.autocomplete = 'nickname';
  input.enterKeyHint = 'done';
  input.setAttribute('aria-label', '昵称');
  const err = el('p', 'mb-err');
  err.setAttribute('role', 'alert');
  card.append(input, err);
  const ok = () => {
    const name = input.value.trim().slice(0, 12);
    if (!name){ err.textContent = '先起个名字'; input.focus(); return; }
    const renamed = m.name && m.name !== name;
    store.set('me', Object.assign(me(), {name}));
    if (renamed && !PREVIEW) api('rpc/mini_rename', {p_player: m.pid, p_name: name}).catch(() => {});
    then();
  };
  // 回车只算一次：不拦住的话，这一下还会按到下一个弹窗里的按钮
  input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key !== 'Enter' || e.isComposing) return; e.preventDefault(); ok(); });
  const row = el('div', 'mb-row2');
  const skip = el('button', 'mb-btn', m.name ? '不改了' : '先不上榜');
  skip.type = 'button';
  skip.addEventListener('click', m.name ? then : close);
  const go = el('button', 'mb-btn main', '好了');
  go.type = 'button';
  go.addEventListener('click', ok);
  row.append(skip, go);
  card.appendChild(row);
  open(card);
  // 改名的时候旧名字整个选中，直接打字就替换掉
  setTimeout(() => { input.focus(); input.select(); }, 60);
}
const api0 = {init(o){ cfg = Object.assign({first: false}, o); }, submit, show, close, hasName: () => !!me().name};
if (['localhost', '127.0.0.1'].includes(location.hostname)) api0.mock = fn => { api = fn; };
return api0;
})();
</script>

<script>
(async () => {
'use strict';
MiniBoard.init({game: 'dashuipiao'});
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d){ try { const v = localStorage.getItem('dsp:' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } },
  set(k, v){ try { localStorage.setItem('dsp:' + k, JSON.stringify(v)); } catch (e){} }
};
function seeded(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for (const ch of s){ h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const W = 420, H = 740, HOR = 292, F = 380, CH = 1.7;

/* ================= 今天的石头和风 ================= */
const STONES = [
  {name: '扁平青石', q: 1, windK: .5, col: ['#7d8a92', '#4c565e']},
  {name: '鹅卵石', q: .86, windK: .3, col: ['#b5a79a', '#7a6c62']},
  {name: '碎瓦片', q: 1.06, windK: 1, col: ['#8a7f86', '#5a4f58']},
  {name: '小石板', q: .95, windK: .6, col: ['#9a9286', '#5e584e']}
];
const dayR = seeded(hashStr('skip' + todayKey()));
const TODAY = {stone: STONES[Math.floor(dayR() * STONES.length)], wind: Math.round((dayR() * 2 - 1) * 3 * 10) / 10};
// 每天湖面上摆的东西：航道里几片荷叶（石头落上去就停）、两只来回游的鸭子（砸到就停）、一个花环（有一跳落进去算 5 跳）
const LAKE = (() => {
  const R = dayR, side = R() < .5 ? -1 : 1;
  const ring = {x: side * (2.2 + R() * 1.6), z: 20 + R() * 20, r: 1.05};
  const pads = [];
  for (let z = 9 + R() * 4; z < 62; z += 5 + R() * 6) pads.push({x: (R() * 2 - 1) * 3, z, r: .55 + R() * .35, a: R() * TAU, flower: R() < .25});

  const ducks = [0, 1].map(k => ({z: k ? 44 + R() * 10 : 27 + R() * 8, A: 3.5 + R() * 1.5, w: .35 + R() * .25, ph: R() * TAU, hit: 0, hx: 0}));
  return {ring, ducks, pads: pads.filter(p => Math.hypot(p.x - ring.x, p.z - ring.z) > p.r + ring.r + .6)};

// width：角度甜区多宽；vbest / vw：超过这个速度就开始翻，越猛翻得越厉害
const P = {width: 9, drag: .03, vmin: 1.2, bmax: .5, f0: .71, f1: .25, fb: .1, c: .08, e0: .3, e1: .35, lift: .06, vbest: 16, vw: 4.5};
function makeStone(v, lat, tilt){
  const elev = -.05;
  return {x: 0, y: 1, z: .4, vx: v * Math.cos(elev) * Math.sin(lat), vz: v * Math.cos(elev) * Math.cos(lat), vy: v * Math.sin(elev), q: TODAY.stone.q * Math.exp(-(((tilt - 20) / P.width) ** 2)) * (v > P.vbest ? Math.exp(-(((v - P.vbest) / P.vw) ** 2)) : 1), skips: 0, bonus: 0, ring: false, why: '', trail: [], alive: true, spin: 0, tilt};
}
function stepStone(s, dt, onSkip, onSink){
  if (!s.alive) return;
  s.vy -= 9.8 * dt;
  s.vz *= 1 - P.drag * dt;
  s.vx += TODAY.wind * TODAY.stone.windK * .25 * dt;
  s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
  s.spin += dt * 40;
  if (s.y <= 0 && s.vy < 0){
    const vh = Math.hypot(s.vx, s.vz), beta = Math.atan2(-s.vy, vh);
    if (vh < P.vmin || beta > P.bmax || s.q < .12){ s.alive = false; s.y = 0; onSink(s); return; }
    const f = P.f0 + P.f1 * s.q - P.fb * beta;
    s.vx *= f; s.vz *= f;
    const vh2 = Math.hypot(s.vx, s.vz), k = Math.max(0, vh2 - P.c) / (vh2 || 1);
    s.vx *= k; s.vz *= k;
    s.vy = -s.vy * (P.e0 + P.e1 * s.q) + Math.hypot(s.vx, s.vz) * P.lift * s.q;
    s.y = 0;
    s.skips++;
    onSkip(s);
  }
}

cv.addEventListener('pointermove', e => { if (st === 'hold'){ trail.push(TO(e)); if (trail.length > 40) trail.shift(); } });

cv.addEventListener('pointercancel', () => { if (st === 'hold') st = 'aim'; });
function throwStone(speed, lat, tilt){

function stopStone(s, why){ s.alive = false; s.why = why; s.vx = s.vy = s.vz = 0; }
function onSkip(s){

// 鸭子：石头贴着水面飞过鸭子所在的地方就砸到了
function hitDuck(s){
  const t = now();
  for (const d of LAKE.ducks){
    if (d.hit || s.y > .5 || Math.abs(s.z - d.z) > .45) continue;
    const x = duckX(d, t);
    if (Math.abs(s.x - x) < .75){
      d.hit = t; d.hx = x; stopStone(s, 'duck');

}
function onSink(s){
  ripples.push({x: s.x, z: s.z, t0: now(), dur: 3.5, size: 1.4, rings: 4});
  for (let k = 0; k < 18; k++) drops.push({x: s.x, y: 0, z: s.z, vx: (Math.random() - .5) * 2.5, vy: 1.5 + Math.random() * 3.5, vz: (Math.random() - .5) * 2, life: .9});

const now = () => performance.now() / 1000;
function finish(){

  const r = $('result');
  r.querySelector('b').textContent = `${skips} 跳 · ${rating}`;
  const tiltTxt = Math.abs(stone.tilt - 20) < 2 ? '角度正好' : stone.tilt < 20 ? `角度 ${stone.tilt.toFixed(0)}°，太平了` : `角度 ${stone.tilt.toFixed(0)}°，太斜了`;
  const powTxt = stone.power > .86 ? '用力过猛' : stone.power < .62 ? '力气小了' : '力度正好';
  r.querySelector('span').textContent = `${dist.toFixed(1)} 米 · ${powTxt} ${Math.round(stone.power * 100)}% · ${tiltTxt}${stone.ring ? ' · 穿过花环' : ''}`;
  r.classList.add('show');
  const best = store.get('best', {skips: 0, dist: 0});
  let rec = false;

    MiniBoard.submit('', {a: skips, b: Math.round(dist * 10) / 10, shown: `${skips} 跳`, extra: `${dist.toFixed(1)} 米${stone.ring ? ' · 花环' : ''}`});

  st = 'done';
  camReturn = now();
  setTimeout(() => { if (st === 'done'){ st = 'aim'; $('hint').textContent = practice() ? '随便扔，破纪录也算数' : '再扔一块'; $('hint').style.opacity = 1; } }, 1600);
}
function summary(){

  const b = store.get('best', {skips: 0, dist: 0});

  const text = `打水漂 ${todayKey().slice(5).replace('-', '月')}日\n🪨${'〰️'.repeat(Math.min(10, Math.ceil(best / 3)))} ${best} 跳\n三投：${daily.throws.join(' / ')}`;
  const row = el('div', 'row');

const showBoard = () => MiniBoard.show('', {title: '今日排行榜', sub: `${todayKey().slice(5).replace('-', '月')}日 · 同一块石头、同一阵风，三投里最好的一投`, empty: '扔完今天的三投就能上榜'});
$('btnBoard').addEventListener('click', () => { Sound.unlock(); showBoard(); });
function help(){

  const ul = el('ul');
  for (const t of ['按住屏幕，下面的角度表会来回摆，按得越久摆得越快。', '松手那一刻的角度很关键，20° 左右最好（绿色那一小段），差几度就少跳好多。', '手指往上一甩把石头扔出去，往左往右甩会偏。力气要刚好，七八成最好，用力过猛石头会翻。', '湖里有荷叶和鸭子：石头落在荷叶上、砸到鸭子就停了。花环里落一跳算 5 跳。右上角的湖面图能看清远处，往左往右甩一点就能绕开。', '每天有一块不一样的石头、一阵不一样的风，湖面也不一样。三投里最好的一次算今天的成绩，之后可以随便扔。']) ul.appendChild(el('li', '', t));

function copy(t){ const fb = () => { const ta = el('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e){} ta.remove(); }; try { navigator.clipboard.writeText(t).catch(fb); } catch (e){ fb(); } }
function openModal(card){ const m = $('modal'); m.replaceChildren(card); m.hidden = false; }
function closeModal(){ $('modal').hidden = true; }

/* ================= 每一帧 ================= */
let last = performance.now();
function frame(nowMs){
  const t = nowMs / 1000, dt = Math.min(.05, (nowMs - last) / 1000);
  last = nowMs;
  if (st === 'fly' && stone){
    const sub = 8;
    // 物理时间比真实快一点，好的一投不用等太久
    for (let k = 0; k < sub; k++){ stepStone(stone, dt * 1.35 / sub, onSkip, onSink); if (stone.alive) hitDuck(stone); }
    $('dist').textContent = Math.max(0, stone.z).toFixed(1) + ' 米';
  }
  // 镜头：飞的时候跟着石头，扔完慢慢回到岸边
  const tz = st === 'fly' || (st === 'done' && now() - camReturn < 1.2) ? (stone ? Math.max(-3, stone.z - 7) : -3) : -3;
  const tx = st === 'fly' && stone ? stone.x * .6 : 0;
  const k = st === 'fly' ? 1 - Math.exp(-dt * 3) : 1 - Math.exp(-dt * 1.4);

  for (let i = drops.length - 1; i >= 0; i--){ const d = drops[i]; d.life -= dt; d.vy -= 9.8 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt; if (d.life <= 0 || d.y < 0) drops.splice(i, 1); }

  requestAnimationFrame(frame);
}
function draw(t, dt){
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (bg) c.drawImage(bg, 0, 0);
  c.setTransform(S, 0, 0, S, 0, 0);
  drawBirds(c, t, dt);
  drawWater(c, t);
  const items = [...PADS, ...LAKE.pads].map(p => ({z: p.z, f: () => drawPad(c, p)}));
  items.push({z: LAKE.ring.z, f: () => drawRing(c, LAKE.ring, t)});
  for (const d of LAKE.ducks) items.push({z: d.z, f: () => drawDuck(c, d, t)});
  for (const it of items.filter(i => i.z > cam.z + .3).sort((a, b) => b.z - a.z)) it.f();

// 手里的石头和角度表
function drawHand(c, t){

  g.addColorStop(0, TODAY.stone.col[0]); g.addColorStop(1, TODAY.stone.col[1]);
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 54, 20, 0, 0, TAU); c.fill();

/* ================= 声音 ================= */
const Sound = (() => {
  let ac = null, out, nb, amb = null;
  const A = {on: store.get('sound', true) !== false};
  A.unlock = () => {
    if (ac){ if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)(); out = ac.createGain(); out.gain.value = A.on ? .8 : 0; out.connect(ac.destination);

      const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
      const g = ac.createGain(); g.gain.value = .025;
      const lfo = ac.createOscillator(); lfo.frequency.value = .18; const lg = ac.createGain(); lg.gain.value = .018; lfo.connect(lg); lg.connect(g.gain);
      s.connect(f); f.connect(g); g.connect(out); s.start(); lfo.start();

    } catch (e){}

  const noise = (d, g, f1, f2, type = 'bandpass', t = 0) => { if (!ac || !A.on) return; const t0 = ac.currentTime + t, s = ac.createBufferSource(); s.buffer = nb; const f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f1, t0); f.frequency.exponentialRampToValueAtTime(f2, t0 + d); const e = ac.createGain(); e.gain.setValueAtTime(.0001, t0); e.gain.linearRampToValueAtTime(g, t0 + .005); e.gain.exponentialRampToValueAtTime(.0001, t0 + d); s.connect(f); f.connect(e); e.connect(out); s.start(t0); s.stop(t0 + d + .05); };

  A.record = () => [784, 988, 1175, 1568].forEach((f, k) => tone(f, .6, .07, 'triangle', .3 + k * .1));

  A.quack = () => { tone(560, .13, .07, 'sawtooth', 0, 420); tone(520, .16, .07, 'sawtooth', .17, 380); };

})();

})();
